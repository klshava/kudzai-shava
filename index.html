<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Static Shop Example</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f7f7f7; }
  h1 { text-align: center; }
  .products { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
  .product { background: #fff; padding: 15px; border-radius: 8px; width: 200px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
  .product img { max-width: 100%; border-radius: 5px; }
  .cart-link { position: fixed; top: 20px; right: 20px; background: #0070ba; color: #fff; padding: 10px 15px; border-radius: 5px; text-decoration: none; }
</style>
</head>
<body>

<h1>My Static Shop</h1>

<a class="cart-link" href="cart.html">Go to Cart (<span id="cart-count">0</span>)</a>

<div class="products" id="products"></div>

<script>
const products = [
  { id: 1, name: "Red Mug", price: 15.00, img: "https://via.placeholder.com/150/FF0000/FFFFFF?text=Red+Mug" },
  { id: 2, name: "Blue T-Shirt", price: 25.00, img: "https://via.placeholder.com/150/0000FF/FFFFFF?text=Blue+T-Shirt" },
  { id: 3, name: "Green Notebook", price: 10.00, img: "https://via.placeholder.com/150/00FF00/FFFFFF?text=Green+Notebook" }
];

// Initialize cart from localStorage
let cart = JSON.parse(localStorage.getItem('cart')) || [];

const productsDiv = document.getElementById('products');
const cartCount = document.getElementById('cart-count');
cartCount.textContent = cart.length;

// Render products
products.forEach(p => {
  const div = document.createElement('div');
  div.className = 'product';
  div.innerHTML = `
    <img src="${p.img}" alt="${p.name}">
    <h3>${p.name}</h3>
    <p>$${p.price.toFixed(2)}</p>
    <button onclick="addToCart(${p.id})">Add to Cart</button>
  `;
  productsDiv.appendChild(div);
});

function addToCart(productId) {
  const product = products.find(p => p.id === productId);
  cart.push(product);
  localStorage.setItem('cart', JSON.stringify(cart));
  cartCount.textContent = cart.length;
}
</script>

</body>
</html>
