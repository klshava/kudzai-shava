<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Static Shop</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f7f7f7; }
  h1 { text-align: center; }
  table { width: 100%; max-width: 600px; margin: 20px auto; border-collapse: collapse; }
  th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
  img { max-width: 50px; }
  button { background: #0070ba; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
  button:hover { background: #005ea6; }
  a { text-decoration: none; color: #0070ba; }
</style>
</head>
<body>

<h1>Your Cart</h1>
<a href="index.html">← Back to Shop</a>

<table id="cart-table">
  <tr>
    <th>Item</th>
    <th>Name</th>
    <th>Price</th>
    <th>Remove</th>
  </tr>
</table>

<p style="text-align:center; font-size: 18px;">Total: $<span id="total">0</span></p>

<div style="text-align:center;">
  <button id="checkout-btn">Checkout via PayPal</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];
const table = document.getElementById('cart-table');
const totalEl = document.getElementById('total');

function renderCart() {
  // Clear table rows except header
  table.innerHTML = `
    <tr>
      <th>Item</th>
      <th>Name</th>
      <th>Price</th>
      <th>Remove</th>
    </tr>
  `;
  let total = 0;
  cart.forEach((p, index) => {
    total += p.price;
    const row = table.insertRow();
    row.innerHTML = `
      <td><img src="${p.img}" alt="${p.name}"></td>
      <td>${p.name}</td>
      <td>$${p.price.toFixed(2)}</td>
      <td><button onclick="removeItem(${index})">X</button></td>
    `;
  });
  totalEl.textContent = total.toFixed(2);
}

function removeItem(index) {
  cart.splice(index, 1);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

document.getElementById('checkout-btn').addEventListener('click', () => {
  if (cart.length === 0) {
    alert('Your cart is empty!');
    return;
  }
  // Simple PayPal checkout for multiple items
  let url = `https://www.paypal.com/cgi-bin/webscr?cmd=_cart&upload=1&business=youremail@example.com&currency_code=USD`;
  cart.forEach((item, i) => {
    url += `&item_name_${i+1}=${encodeURIComponent(item.name)}`;
    url += `&amount_${i+1}=${item.price.toFixed(2)}`;
    url += `&quantity_${i+1}=1`;
  });
  window.open(url, '_blank');
});

renderCart();
</script>

</body>
</html>
